<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paycheck Calculator — Take-Home Pay After Taxes</title>
<meta name="description" content="Free US paycheck calculator. Estimate your take-home pay after federal income tax, FICA, and state income tax. Covers all 50 states and DC. No signup needed." />
<style>
.pc-app {
  --pc-bg: #ffffff;
  --pc-fg: #1a1a1a;
  --pc-muted: #5b6470;
  --pc-border: #d9dee5;
  --pc-accent: #0b6b3a;
  --pc-accent-fg: #ffffff;
  --pc-surface: #f6f8fa;
  max-width: 720px;
  margin: 0 auto;
  padding: 16px;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  color: var(--pc-fg);
  line-height: 1.5;
  box-sizing: border-box;
}
.pc-app *, .pc-app *::before, .pc-app *::after { box-sizing: inherit; }

.pc-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
.pc-field { flex: 1 1 180px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pc-field > span { font-size: 0.875rem; font-weight: 600; }
.pc-field small { font-weight: 400; color: var(--pc-muted); }

.pc-field input,
.pc-field select {
  width: 100%;
  padding: 10px 12px;
  font-size: 16px; /* prevents iOS zoom */
  border: 1px solid var(--pc-border);
  border-radius: 8px;
  background: var(--pc-bg);
  color: var(--pc-fg);
}
.pc-field input:focus,
.pc-field select:focus { outline: 2px solid var(--pc-accent); outline-offset: 1px; }

.pc-advanced { margin: 8px 0 16px; border: 1px solid var(--pc-border); border-radius: 8px; padding: 8px 12px; }
.pc-advanced summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.pc-advanced .pc-row:first-of-type { margin-top: 12px; }

.pc-submit {
  width: 100%;
  padding: 14px 16px;
  font-size: 1rem;
  font-weight: 700;
  color: var(--pc-accent-fg);
  background: var(--pc-accent);
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}
.pc-submit:hover { filter: brightness(1.08); }

.pc-result { margin-top: 24px; }
.pc-net { background: var(--pc-surface); border: 1px solid var(--pc-border); border-radius: 12px; padding: 16px; text-align: center; }
.pc-net-label { display: block; font-size: 0.9rem; color: var(--pc-muted); }
.pc-net-value { display: block; font-size: 2.25rem; font-weight: 800; letter-spacing: -0.02em; }
.pc-net-annual { display: block; font-size: 0.9rem; color: var(--pc-muted); }

.pc-breakdown { width: 100%; border-collapse: collapse; margin-top: 16px; }
.pc-breakdown th, .pc-breakdown td { padding: 8px 4px; text-align: left; border-bottom: 1px solid var(--pc-border); }
.pc-breakdown td { text-align: right; font-variant-numeric: tabular-nums; }
.pc-breakdown th { font-weight: 500; color: var(--pc-muted); }
.pc-total th, .pc-total td { font-weight: 800; color: var(--pc-fg); border-bottom: 0; }

.pc-rates { margin: 12px 0; font-size: 0.9rem; color: var(--pc-muted); }

.pc-math { border: 1px solid var(--pc-border); border-radius: 8px; padding: 8px 12px; margin: 12px 0; }
.pc-math summary { cursor: pointer; font-weight: 600; }
.pc-math ol { margin: 12px 0 4px; padding-left: 20px; }
.pc-math li { margin-bottom: 8px; font-size: 0.875rem; }
.pc-math code { background: var(--pc-surface); padding: 1px 4px; border-radius: 4px; word-break: break-word; }
.pc-trace-label { font-weight: 600; }

.pc-disclaimer { font-size: 0.8125rem; color: var(--pc-muted); background: var(--pc-surface); border-radius: 8px; padding: 10px 12px; }
.pc-updated { font-size: 0.75rem; color: var(--pc-muted); }

/* Intro prose and FAQ live outside .pc-app, so they must not inherit its
   scoped custom properties. */
.pc-intro { margin: 0 0 16px; max-width: 68ch; line-height: 1.6; }

.pc-faq { margin: 24px 0 0; max-width: 68ch; }
.pc-faq h2 { font-size: 1.25rem; margin: 0 0 12px; }
.pc-faq details { border: 1px solid var(--pc-border, #e2e5ea); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
.pc-faq summary { cursor: pointer; font-weight: 600; }
.pc-faq p { margin: 8px 0 4px; line-height: 1.6; }

@media (max-width: 420px) {
  .pc-net-value { font-size: 1.85rem; }
  .pc-app { padding: 12px; }
}

</style>
</head>

 * Pure paycheck calculation engine.
 *
 * The engine holds NO tax rates. All rate data is injected, per the
 * tax-data spec principle: "rates live in data, logic lives in code."
 *
 * Calculation order is load-bearing (see TAX-DATA-SCHEMA spec §7.2).

const PERIODS = {
  weekly: 52,
  biweekly: 26,
  semimonthly: 24,
  monthly: 12,
  annual: 1,
};

const FILING_STATUSES = ["single", "mfj", "mfs", "hoh"];

const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;

/**
 * Marginal tax on a wage amount. Applies each bracket's rate only to the
 * income falling inside that bracket. This is the most error-prone
 * function in the engine and has dedicated fixtures.
 */
function bracketTax(wages, brackets) {
  if (!brackets) return 0;
  let tax = 0;
  for (const b of brackets) {
    if (wages <= b.min) break;
    const top = b.max === null || b.max === undefined ? wages : b.max;
    const taxable = Math.min(wages, top) - b.min;
    if (taxable > 0) tax += taxable * b.rate;

  if (!brackets) return 0;
  let rate = 0;
  for (const b of brackets) {
    if (wages > b.min && (b.max === null || b.max === undefined || wages <= b.max)) {
      rate = b.rate;
    }
  }
  return rate;
}

function grossPerPeriod(inputs) {
  const periods = PERIODS[inputs.pay_frequency];
  if (inputs.pay_type === "salary") {
    return inputs.annual_salary / periods;
  }
  if (inputs.pay_type === "hourly") {
    const hours = inputs.hours_per_week ?? 40;
    const base = inputs.hourly_rate * hours;
    const ot = (inputs.overtime_hours ?? 0) * inputs.hourly_rate * (inputs.overtime_multiplier ?? 1.5);
    return base + ot;
  }
  throw new Error(`Unknown pay_type: ${inputs.pay_type}`);
}

function deductionAmount(d, periods) {
  const amt = d.frequency === "per_period" ? d.amount : d.amount / periods;
  return amt;
}

/**
 * @param {object} inputs
 * @param {object} data  { federal, state } — resolved records for the tax year
 * @returns {object} result with per-line amounts and a `trace` for "show the math"
 */
function calculate(inputs, data) {
  const { federal, state } = data;
  if (!federal) throw new Error("Federal data required");
  if (!state) throw new Error("State data required");
  if (!FILING_STATUSES.includes(inputs.filing_status)) {
    throw new Error(`Unknown filing_status: ${inputs.filing_status}`);
  }

  const periods = PERIODS[inputs.pay_frequency];
  if (!periods) throw new Error(`Unknown pay_frequency: ${inputs.pay_frequency}`);

  const trace = [];
  const push = (label, formula, result) => trace.push({ label, formula, result: round2(result) });

  // 1. gross
  const gross_per_period = grossPerPeriod(inputs);
  const gross_annual = gross_per_period * periods;
  push("Gross pay per period", `$${round2(gross_annual)} annual / ${periods} periods`, gross_per_period);

  // 2-3. wage bases (deductions have different flags for income tax vs FICA)
  const deductions = inputs.deductions ?? [];
  let preIncomeTax = 0;
  let preFica = 0;
  let postTax = 0;
  for (const d of deductions) {
    const amt = deductionAmount(d, periods);
    if (d.reduces_income_tax) preIncomeTax += amt;
    if (d.reduces_fica) preFica += amt;
    if (!d.reduces_income_tax && !d.reduces_fica) postTax += amt;
  }
  const pre_tax_deductions = preIncomeTax;

  const income_tax_wages = gross_annual - preIncomeTax * periods;
  const fica_wages = gross_annual - preFica * periods;

  // W-4 adjustments
  const w4 = inputs.w4 ?? {};
  const annualWagesForFed =
    income_tax_wages + (w4.step4a_other_income ?? 0) - (w4.step4b_deductions ?? 0);

  // 5. federal income tax
  const stdDed = federal.income_tax.standard_deduction[inputs.filing_status] ?? 0;
  const taxableAfterStd = Math.max(0, annualWagesForFed - stdDed);
  const tentative = bracketTax(taxableAfterStd, federal.income_tax.brackets[inputs.filing_status]);
  const annualFed = Math.max(0, tentative - (w4.step3_credits ?? 0));
  const federal_income_tax = annualFed / periods + (w4.step4c_extra_withholding ?? 0);
  push(
    "Federal income tax",
    `($${round2(taxableAfterStd)} after $${stdDed} std deduction → brackets = $${round2(tentative)}) − credits, ÷ ${periods}`,
    federal_income_tax

  const ssBase = Math.min(fica_wages, federal.fica.social_security_wage_base);
  const social_security = (ssBase * federal.fica.social_security_rate) / periods;
  push(
    "Social Security",
    `min($${round2(fica_wages)}, $${federal.fica.social_security_wage_base}) × ${federal.fica.social_security_rate} ÷ ${periods}`,
    social_security
  );

  const medicare = (fica_wages * federal.fica.medicare_rate) / periods;
  push("Medicare", `$${round2(fica_wages)} × ${federal.fica.medicare_rate} ÷ ${periods}`, medicare);

  const amThreshold = federal.fica.additional_medicare_thresholds[inputs.filing_status];
  const addMedAnnual = Math.max(0, fica_wages - amThreshold) * federal.fica.additional_medicare_rate;
  const additional_medicare = addMedAnnual / periods;
  if (additional_medicare > 0) {
    push(
      "Additional Medicare",
      `max(0, $${round2(fica_wages)} − $${amThreshold}) × ${federal.fica.additional_medicare_rate} ÷ ${periods}`,
      additional_medicare
    );
  }

  // 8. state income tax
  let state_income_tax = 0;
  if (state.no_income_tax || !state.income_tax) {
    push("State income tax", `${state.jurisdiction} has no state income tax`, 0);
  } else {
    const sStd = state.income_tax.standard_deduction?.[inputs.filing_status] ?? 0;
    const sTaxable = Math.max(0, income_tax_wages - sStd);
    const sAnnual = bracketTax(sTaxable, state.income_tax.brackets[inputs.filing_status]);
    state_income_tax = sAnnual / periods;
    push(
      "State income tax",
      `$${round2(sTaxable)} after $${sStd} std deduction → ${state.jurisdiction} brackets ÷ ${periods}`,
      state_income_tax
    );
  }

  // 9. net
  const totalTaxPerPeriod =
    federal_income_tax + social_security + medicare + additional_medicare + state_income_tax;
  const totalDeductionsPerPeriod = preIncomeTax + postTax;
  const net_per_period = gross_per_period - totalTaxPerPeriod - totalDeductionsPerPeriod;

  const totalTaxAnnual = totalTaxPerPeriod * periods;

  const marginal =
    marginalRate(taxableAfterStd, federal.income_tax.brackets[inputs.filing_status]) || 0;

  return {
    gross_per_period: round2(gross_per_period),
    gross_annual: round2(gross_annual),
    federal_income_tax: round2(federal_income_tax),
    social_security: round2(social_security),
    medicare: round2(medicare),
    additional_medicare: round2(additional_medicare),
    state_income_tax: round2(state_income_tax),
    pre_tax_deductions: round2(preIncomeTax),
    post_tax_deductions: round2(postTax),
    net_per_period: round2(net_per_period),
    net_annual: round2(net_per_period * periods),
    effective_rate: Number(effective_rate.toFixed(4)),
    marginal_rate: marginal,
    trace,
  };
}

function mount(root, deps) {

      el.hidden = el.dataset.when !== pt;

  };

    const payType = f.pay_type.value;

    const deductions = [];
    for (const d of DEDUCTION_PRESETS) {
      const amt = Number(f[`ded_${d.id}`]?.value || 0);
      if (amt > 0) {
        deductions.push({
          type: d.type,
          amount: amt,
          frequency: "per_period",
          reduces_income_tax: d.reduces_income_tax,
          reduces_fica: d.reduces_fica,
        });
      }
    }

    const inputs = {
      pay_type: payType,
      annual_salary: Number(f.annual_salary.value || 0),
      hourly_rate: Number(f.hourly_rate.value || 0),
      hours_per_week: Number(f.hours_per_week.value || 40),
      overtime_hours: Number(f.overtime_hours.value || 0),
      overtime_multiplier: 1.5,
      pay_frequency: f.pay_frequency.value,
      filing_status: f.filing_status.value,
      state: f.state.value,
      deductions,
      w4: {
        step3_credits: Number(f.w4_step3.value || 0),
        step4a_other_income: 0,
        step4b_deductions: 0,
        step4c_extra_withholding: Number(f.w4_step4c.value || 0),
      },
    };

    let res;
    try {
      res = calculate(inputs, {
        federal: getFederal(taxYear),
        state: getState(f.state.value, taxYear),
      });
    } catch (err) {
      result.hidden = false;
      result.querySelector(".pc-net-value").textContent = "Check your inputs";
      return;
    }

    const set = (k, v) => {
      const el = result.querySelector(`[data-out="${k}"]`);
      if (el) el.textContent = v;
    };
    set("net_per_period", fmt(res.net_per_period));
    set("net_annual", `${fmt(res.net_annual)} / year`);
    for (const k of [
      "gross_per_period",
      "federal_income_tax",
      "social_security",
      "medicare",
      "additional_medicare",
      "state_income_tax",
      "pre_tax_deductions",
      "post_tax_deductions",
    ]) {
      set(k, fmt(res[k]));

    set("net_per_period_total", fmt(res.net_per_period));

    set("marginal_rate", `${(res.marginal_rate * 100).toFixed(0)}%`);
