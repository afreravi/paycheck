<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paycheck Calculator — Take-Home Pay After Taxes</title>
<meta name="description" content="Free US paycheck calculator. Estimate your take-home pay after federal income tax, FICA, and state income tax. Covers all 50 states and DC. No signup needed." />
<style>

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; color: #221f28; }
.row { display: flex; flex-wrap: wrap; margin-right: -15px; margin-left: -15px; }
.row > [class*="col-"] { position: relative; width: 100%; padding-right: 15px; padding-left: 15px; }
.col-12 { flex: 0 0 100%; max-width: 100%; }
@media (min-width: 768px) {
  .col-md-4 { flex: 0 0 33.333333%; max-width: 33.333333%; }
  .col-md-6 { flex: 0 0 50%; max-width: 50%; }
}
.form-group { margin-bottom: 1rem; }
label { display: inline-block; margin-bottom: .5rem; }
.form-control { display: block; width: 100%; height: calc(1.5em + .75rem + 2px); padding: .375rem .75rem; }
.custom-select { display: block; width: 100%; height: calc(1.5em + .75rem + 2px); padding: .375rem 1.75rem .375rem .75rem; }
.input-group { position: relative; display: flex; flex-wrap: wrap; align-items: stretch; width: 100%; }
.input-group > .form-control { position: relative; flex: 1 1 auto; width: 1%; min-width: 0; margin-bottom: 0; }
.input-group-prepend, .input-group-append { display: flex; }
.input-group-prepend { margin-right: -1px; }
.input-group-append { margin-left: -1px; }
.input-group-text { display: flex; align-items: center; padding: .375rem .75rem; margin-bottom: 0; white-space: nowrap; }
.input-group > .input-group-prepend > .input-group-text { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.input-group > .input-group-append > .input-group-text { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.btn { display: inline-block; font-weight: 400; text-align: center; vertical-align: middle; user-select: none; border: 1px solid transparent; }
.btn-block { display: block; width: 100%; }
.btn-lg { padding: .5rem 1rem; font-size: 1.25rem; line-height: 1.5; border-radius: .3rem; }
.table { width: 100%; margin-bottom: 1rem; border-collapse: collapse; }
.table td, .table th { padding: .75rem; vertical-align: top; border-top: 1px solid #e8e2f0; }
.table-sm td, .table-sm th { padding: .3rem; }
.table-responsive { display: block; width: 100%; overflow-x: auto; }
.text-right { text-align: right !important; }
.text-muted { color: #6a6673 !important; }
.small { font-size: 80%; }
.font-weight-bold { font-weight: 700 !important; }
.text-uppercase { text-transform: uppercase !important; }
.h6 { font-size: 1rem; }
.mb-0 { margin-bottom: 0 !important; }
.mb-2 { margin-bottom: .5rem !important; }
.mb-3 { margin-bottom: 1rem !important; }
.mb-4 { margin-bottom: 1.5rem !important; }
.mt-2 { margin-top: .5rem !important; }
.mt-3 { margin-top: 1rem !important; }
.mt-4 { margin-top: 1.5rem !important; }

/* Paycheck calculator styling.
 *
 * Matches the palette and component vocabulary used by the other afreetools
 * calculators (see /rule-of-72-calculator): Bootstrap 4 grid + utilities, plus
 * a small set of brand components. WordPress supplies Bootstrap 4.6.2 from the
 * theme, so this file only carries what Bootstrap does not.
 *
 * The standalone build has no Bootstrap, so tools/build.mjs prepends a minimal
 * shim for the grid and utility classes used here. Keep that shim in sync if
 * the markup starts using new Bootstrap classes.
 */

:root {
  --brand: #60089c;
  --brand-deep: #3f0568;
  --brand-bright: #8b2fd0;
  --brand-wash: #f7f1fd;
  --brand-edge: #e3d4f4;
  --ink: #221f28;
  --muted: #6a6673;
  --rule: #e8e2f0;
  --good: #1c7d4d;
  --bad: #b32639;
}

/* ---------- labels ---------- */
.section-kicker {
  color: var(--brand-deep);
  letter-spacing: .08em;
  font-size: .76rem;
  border-left: 3px solid var(--brand);
  padding-left: .55rem;
}

label { font-weight: 600; font-size: .95rem; color: var(--ink); }
.form-text { color: var(--muted); font-size: .82rem; }

/* ---------- form ---------- */
.form-control, .custom-select {
  border-color: var(--rule);
  border-radius: .25rem;
  color: var(--ink);
  font-size: 1.05rem;
  background-color: #fff;
}
.form-control:focus, .custom-select:focus {
  border-color: var(--brand-bright);
  box-shadow: 0 0 0 .2rem rgba(96, 8, 156, .14);
}
.input-group-text {
  background: var(--brand-wash);
  border-color: var(--rule);
  color: var(--brand-deep);
  font-weight: 700;
}

/* ---------- buttons ---------- */
.btn-brand {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
  font-weight: 600;
  padding: .6rem 1.35rem;
}
.btn-brand:hover, .btn-brand:focus {
  background: var(--brand-deep);
  border-color: var(--brand-deep);
  color: #fff;
}

/* ---------- stat tiles ---------- */
.stat-tile {
  display: block;
  padding: 1rem 1.1rem;
  border: 1px solid var(--rule);
  border-left: 4px solid var(--brand);
  border-radius: .3rem;
  background: linear-gradient(90deg, var(--brand-wash) 0%, #ffffff 65%);
}
.stat-label {
  display: block;
  font-size: .74rem;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--brand-deep);
  font-weight: 700;
  margin-bottom: .25rem;
}
.stat-value {
  display: block;
  font-size: 2.1rem;
  font-weight: 700;
  color: var(--brand);
  line-height: 1.15;
}
.stat-note { display: block; color: var(--muted); font-size: .84rem; margin-top: .15rem; }

/* ---------- tables ---------- */
.table thead th {
  border-top: 0;
  border-bottom: 2px solid var(--brand-edge);
  color: var(--brand-deep);
  font-size: .8rem;
  letter-spacing: .05em;
  text-transform: uppercase;
}
.table td, .table th { border-color: var(--rule); }
.table-striped tbody tr:nth-of-type(odd) { background: var(--brand-wash); }
.pc-breakdown td { font-variant-numeric: tabular-nums; }
.pc-breakdown .pc-total th, .pc-breakdown .pc-total td {
  font-weight: 800;
  color: var(--ink);
  border-bottom: 0;
}

/* ---------- calculator specifics ---------- */
.pc-app { margin-bottom: 1rem; }

.pc-advanced { border: 1px solid var(--rule); border-radius: .3rem; padding: .5rem .85rem; }
.pc-advanced summary { cursor: pointer; font-weight: 600; color: var(--brand-deep); }

.pc-math { border: 1px solid var(--rule); border-radius: .3rem; padding: .5rem .85rem; }
.pc-math summary { cursor: pointer; font-weight: 600; color: var(--brand-deep); }
.pc-math ol { margin: .75rem 0 .25rem; padding-left: 1.25rem; }
.pc-math li { margin-bottom: .5rem; font-size: .875rem; }
.pc-math code { background: var(--brand-wash); padding: 1px 4px; border-radius: 4px; word-break: break-word; }
.pc-trace-label { font-weight: 600; }

.pc-rates strong { color: var(--ink); }

.pc-disclaimer {
  border-left: 3px solid var(--brand-edge);
  padding-left: .75rem;
}

/* ---------- prose + FAQ (outside .pc-app) ---------- */
.pc-intro { max-width: 70ch; }
.pc-faq { max-width: 70ch; }
.pc-faq details {
  border: 1px solid var(--rule);
  border-radius: .3rem;
  padding: .6rem .85rem;
  margin-bottom: .5rem;
  background: #fff;
}
.pc-faq summary { cursor: pointer; font-weight: 600; color: var(--brand-deep); }
.pc-faq p { margin: .6rem 0 .25rem; }

</style>
</head>

<div class="container" style="max-width: 960px; margin: 0 auto; padding: 24px 15px;">
<main id="paycheck-calculator" class="pc-app" aria-label="Paycheck calculator"></main>

  };

    e.preventDefault();
    const f = form.elements;
    const taxYear = Number(f.tax_year.value);
    const payType = f.pay_type.value;

    const deductions = [];
    for (const d of DEDUCTION_PRESETS) {
      const amt = Number(f[`ded_${d.id}`]?.value || 0);
      if (amt > 0) {
        deductions.push({
          type: d.type,
          amount: amt,
          frequency: "per_period",
          reduces_income_tax: d.reduces_income_tax,
          reduces_fica: d.reduces_fica,
        });
      }
    }

    const inputs = {
      pay_type: payType,
      annual_salary: Number(f.annual_salary.value || 0),
      hourly_rate: Number(f.hourly_rate.value || 0),
      hours_per_week: Number(f.hours_per_week.value || 40),
      overtime_hours: Number(f.overtime_hours.value || 0),
      overtime_multiplier: 1.5,
      pay_frequency: f.pay_frequency.value,
      filing_status: f.filing_status.value,
      state: f.state.value,
      deductions,
      w4: {
        step3_credits: Number(f.w4_step3.value || 0),
        step4a_other_income: 0,
        step4b_deductions: 0,
        step4c_extra_withholding: Number(f.w4_step4c.value || 0),
      },
    };

    let res;
    try {
      res = calculate(inputs, {
        federal: getFederal(taxYear),
        state: getState(f.state.value, taxYear),
      });
    } catch (err) {
      result.hidden = false;
      result.querySelector(".pc-net-value").textContent = "Check your inputs";
      return;
    }

    const set = (k, v) => {
      const el = result.querySelector(`[data-out="${k}"]`);
      if (el) el.textContent = v;
    };
    set("net_per_period", fmt(res.net_per_period));
    set("net_annual", `${fmt(res.net_annual)} / year`);
    for (const k of [
      "gross_per_period",
      "federal_income_tax",
      "social_security",
      "medicare",
      "additional_medicare",
      "state_income_tax",
      "pre_tax_deductions",
      "post_tax_deductions",
    ]) {
      set(k, fmt(res[k]));
    }
    set("net_per_period_total", fmt(res.net_per_period));
    set("effective_rate", `${(res.effective_rate * 100).toFixed(1)}%`);
    set("marginal_rate", `${(res.marginal_rate * 100).toFixed(0)}%`);

    result.querySelector('[data-out-row="additional_medicare"]').hidden = res.additional_medicare <= 0;

    const ol = result.querySelector('[data-out="trace"]');
    ol.innerHTML = res.trace
      .map((t) => `<li><span class="pc-trace-label">${t.label}</span> <code>${t.formula}</code> = <strong>${fmt(t.result)}</strong></li>`)
      .join("");

    const fed = getFederal(taxYear);
    set("updated", `Tax data: ${fed.tax_year} (v${fed.version}), last verified ${fed.last_verified}.`);

    result.hidden = false;
  });

  return {
    setState(code) {
      form.elements.state.value = code;
    },
  };
}

/**
 * Convenience entry point: wires the engine into the UI.
 * Idempotent, so the inline call and auto-mount cannot double-mount.
 */
function mountCalculator(el) {
  if (!el || el.dataset.pcMounted === "1") return;
  el.dataset.pcMounted = "1";
  return mount(el, { calculate, getFederal, getState, getStateList });
}

/**
 * Auto-mount when a #paycheck-calculator container is present.
 * Lets WordPress load the engine via wp_enqueue_script_module with no inline
 * script at all, which sidesteps wpautop reformatting the JS.
 */
function autoMount() {
  const el = document.getElementById("paycheck-calculator");
  if (el) mountCalculator(el);
}
if (typeof document !== "undefined") {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", autoMount);
  } else {
    autoMount();
  }
}

mountCalculator(document.getElementById("paycheck-calculator"));
</script>
</body>
</html>
